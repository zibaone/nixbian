name: Weekly Armbian upgrade
on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-armbian-upgrade
  cancel-in-progress: false

jobs:
  armbian-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check for new Armbian release
        id: check_release
        run: |
          LATEST=$(curl -sL "https://api.github.com/repos/armbian/os/releases/latest" | jq -r .tag_name)
          CURRENT=$(jq -r 'keys | .[]' versions.json 2>/dev/null | sort -V | tail -1)
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "New release: $CURRENT -> $LATEST"
            echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "No new release (current: $CURRENT)"
          fi

      - name: Update versions and metadata
        if: steps.check_release.outputs.new_version != ''
        env:
          # An Armbian upgrade must re-read the upstream Makefiles: otherwise
          # the metadata/kernel-versions.json cache is reused as-is.
          REFRESH_KERNEL_VERSIONS: "1"
        run: nix develop -c just update-versions refresh-metadata

      - name: Resolve and prefetch
        if: steps.check_release.outputs.new_version != ''
        run: |
          nix develop --command python3 scripts/resolve_lock.py

      - name: Commit to auto/armbian-upgrade
        id: commit
        if: steps.check_release.outputs.new_version != ''
        run: |
          git config user.name "nixbian-bot"
          git config user.email "bot@nixbian.dev"
          git checkout -b auto/armbian-upgrade
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: armbian upgrade ${{ steps.check_release.outputs.new_version }}"
          git push origin auto/armbian-upgrade --force
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check_release.outputs.new_version }}
        run: |
          TITLE="chore: Armbian upgrade ${VERSION}"
          BODY="Automatic update to Armbian ${VERSION} (versions.json, metadata/, hashes)."
          if gh pr list --head auto/armbian-upgrade --json number --jq '.[0].number' | grep -q .; then
            gh pr edit auto/armbian-upgrade --title "$TITLE" --body "$BODY"
          else
            gh pr create --base master --head auto/armbian-upgrade --title "$TITLE" --body "$BODY"
          fi

      - name: Nothing to update
        if: steps.check_release.outputs.new_version == ''
        run: echo "No update available - nothing to do."
