name: Metadata & config

# Single owner of the generated state: versions.json, metadata/ and the
# nvfetcher hashes.
#
# It never opens a pull request. A run refreshes the branch
# `auto/metadata-config` and stops there: reviewing the refresh, running CI
# on it and merging it are human decisions, taken when someone asks for it.
# Opening a PR from the bot also cannot work on its own — GitHub treats a
# branch whose commits come from `github-actions[bot]` as a first-time
# contributor and parks the `pull_request` run in `action_required`.
#
# Weekly, not daily: a refresh prefetches every branch that moved upstream,
# and a kernel snapshot takes minutes (35 sources moved in one day when this
# was first measured). The configuration gate does not need this workflow —
# `nix.yml` runs it on every pull request and every push.
#
# Scheduled workflows are registered from the default branch only.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-config
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # 1. Pick up new Armbian tags. `update-versions` only adds tags that
      #    are missing from versions.json, so a no-op run leaves the file
      #    untouched — that change is the signal, no need to compare tag
      #    schemes across two different upstream repositories.
      - name: Detect new Armbian versions
        id: versions
        run: |
          cp versions.json /tmp/versions.before.json
          nix develop --command just update-versions
          if cmp -s /tmp/versions.before.json versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "versions.json is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            diff <(jq -r 'keys[]' /tmp/versions.before.json) \
                 <(jq -r 'keys[]' versions.json) || true
          fi

      # 2. Regenerate metadata/ from the newest pin. This must go through
      #    the generator, never through a hand edit.
      - name: Regenerate metadata
        if: steps.versions.outputs.changed == 'true'
        env:
          # Re-read the upstream Makefiles: the kernel-versions cache must
          # not mask a version bump.
          REFRESH_KERNEL_VERSIONS: "1"
        run: nix develop --command just refresh-metadata

      # 3. Resolve the nvfetcher branches to pinned commits (after the
      #    regeneration, which can rewrite nvfetcher.sources.toml).
      - name: Resolve hashes
        run: nix develop --command python3 scripts/resolve_lock.py

      # 4. Configuration gate: one flake evaluation for all 737 boards.
      #    Runs on every tick, even when nothing moved upstream, so a broken
      #    family is caught without waiting for a release.
      - name: Kernel config gate (all families)
        run: nix develop --command python3 scripts/check_all_configs.py

      # 5. Unit tests: the workflow itself is Python plus generated data.
      - name: Unit tests
        run: nix develop --command pytest -q

      - name: Commit to auto/metadata-config
        id: commit
        run: |
          git config user.name "nixbian-bot"
          git config user.email "bot@nixbian.dev"
          git checkout -b auto/metadata-config
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: metadata and hash refresh"
          git push origin auto/metadata-config --force
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # No pull request on purpose. Spell out how to review the branch
      # instead, so the run is useful on its own.
      - name: Report the refresh branch
        if: always()
        run: |
          {
            echo "## Metadata & config refresh"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "The branch \`auto/metadata-config\` was updated. No pull request was opened."
              echo
              echo "Review it:"
              echo '```'
              echo "git fetch origin auto/metadata-config"
              echo "git diff master...origin/auto/metadata-config"
              echo '```'
              echo "Check it, then merge it when you are ready:"
              echo '```'
              echo "gh workflow run nix.yml --ref auto/metadata-config"
              echo "gh pr create --base master --head auto/metadata-config"
              echo '```'
            else
              echo "No refresh branch was produced: either nothing moved upstream, or a step above failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
