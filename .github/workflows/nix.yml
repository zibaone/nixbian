name: "Nix CI"
on:
  pull_request:
  push:
    branches: [ main, master ]
  # `metadata-config.yml` dispatches this workflow on the refresh branch:
  # a pull request opened with GITHUB_TOKEN never triggers a run by itself,
  # and `workflow_dispatch` is the documented exception.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
    steps:
    - uses: actions/checkout@v7
    
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          experimental-features = nix-command flakes
    
    - uses: DeterminateSystems/magic-nix-cache-action@v15

    - name: "Setup Cachix Cache"
      uses: cachix/cachix-action@v17
      if: ${{ github.event_name != 'pull_request' && env.CACHIX_AUTH_TOKEN != '' }}
      with:
        name: havenos
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # This cache refuses an unsigned narinfo (400 "This cache requires
        # client-side signing"), and `cachix-action` reports "Pushed" even when
        # the server rejected the path — hence the explicit narinfo check below.
        signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
        # Push is explicit, at the end of the job. The default would upload
        # everything this job built: the 62 MiB `metadata` copy (nobody builds
        # it) and the 1.1 GiB devShell closure (re-uploaded on every
        # dependency bump, evicting the kernels that actually matter).
        push: false

    - name: "Flake Check"
      run: nix flake check --show-trace

    - name: "Check Code Formatting"
      run: nix develop --command just check-format

    - name: "Check Template Drift (Generated Metadata)"
      run: nix develop --command just check-drift

    - name: "Run Unit Tests (Pytest)"
      run: nix develop --command pytest

    - name: "Kernel Config Gate (every family/branch pair)"
      run: python3 scripts/check_all_configs.py

    - name: "Board Evaluation Validation (Just Check)"
      run: nix develop --command just check

    - name: "Verify Metadata Generation"
      run: nix build .#metadata

    - name: "Push the CLI to the cache"
      if: ${{ github.event_name != 'pull_request' && env.CACHIX_AUTH_TOKEN != '' }}
      run: |
        path="$(nix build --no-link --print-out-paths .#default)"
        echo "CLI closure: $(nix path-info -Sh "$path" | awk '{print $2}')"
        cachix push havenos "$path"
        hash="${path#/nix/store/}"; hash="${hash%%-*}"
        code="$(curl -s -o /dev/null -w '%{http_code}' "https://havenos.cachix.org/$hash.narinfo")"
        echo "narinfo $hash -> HTTP $code"
        if [ "$code" != "200" ]; then
          echo "::error title=Push refusé::narinfo HTTP $code — le cache exige une signature côté client (CACHIX_SIGNING_KEY manquant ?)."
          exit 1
        fi
