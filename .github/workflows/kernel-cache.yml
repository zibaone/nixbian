name: Kernel cache

# Fills the Cachix cache with the kernels a user actually waits for. `Nix CI`
# evaluates configurations; it never compiles a kernel.
#
# Two runners, on purpose — the store paths are NOT interchangeable:
#
#   ubuntu-latest     → packages.x86_64-linux.kernel-*  (pkgsCross) → what an
#                       x86 machine building an SD image asks for.
#                       Measured: 52 min 40 s.
#   ubuntu-24.04-arm  → packages.aarch64-linux.kernel-* (native) → what an ARM
#                       host asks for. Measured: 39 min 31 s.
#
# Same kernel, two derivations, two paths; a cache filled by one never serves
# the other. Both fit the quota (~41 MiB per kernel), so both are built.
#
# One board per ARM family. Within a family+branch every board resolves to the
# *same* kernel derivation (measured: `nmiyg43p…` for aml-a311d-cc, aml-s9xx-box,
# aml-s905d3-cc and nanopik2-s905; `ldd5cj9v…` for five rockchip64 boards), so
# the reference board only labels the family. Prefer the generic variant when
# the family has one: `aml-s9xx-box` is Armbian's generic Amlogic S905 box, and
# it names the family more honestly than any single board.
#
# Known gap: `orangepizero-current` is armv7l. No GitHub runner is 32-bit, so
# even on ubuntu-24.04-arm it builds `packages.aarch64-linux.*` (an aarch64
# cross to armv7l). A device asking for `packages.armv7l-linux.*` cannot be
# served from CI, whatever the runner.
on:
  schedule:
    # Sunday 03:00 UTC: Sunday morning, after the Monday metadata refresh has
    # had a week to land, and far from the working day.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      boards:
        description: "Space-separated board keys (empty = the five reference boards)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-cache
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.matrix.outputs.boards }}
    steps:
      - name: Build the matrix
        id: matrix
        run: |
          boards="${{ github.event.inputs.boards }}"
          if [ -z "$boards" ]; then
            boards="orangepizero3-edge orangepizero-current rpi4b-current aml-s9xx-box-current orangepi5-current"
          fi
          # One JSON array, consumed by `strategy.matrix` below.
          json="$(printf '%s\n' $boards | jq -R . | jq -sc .)"
          echo "boards=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $json"

  build:
    needs: plan
    # Public mirror only. On a private repo under the Free plan the runner is
    # 2-core, jobs queue for hours, and each board spends ~100 min of the
    # 2000-minute quota — so a timing taken there measures neither the hardware
    # nor the queue users get. The cache is public either way.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.plan.outputs.boards) }}
        # Both, because they produce different derivations: `ubuntu-latest`
        # yields `packages.x86_64-linux.kernel-*` (pkgsCross), `ubuntu-24.04-arm`
        # yields `packages.aarch64-linux.kernel-*` (native). A cache filled by
        # one never serves the other, so both are published.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Measured: a public ubuntu-latest has 145 GiB on `/` with 86 GiB free, so
      # the cleanup below is insurance rather than a fix — the private runner
      # (72 GiB, 14 GiB free) is the one that died at the final link. `/mnt`
      # does not exist on x86 runners but does on the ARM ones, hence the
      # conditional bind. Either way, drop the toolchains a kernel never uses.
      - name: "Disk: free space, mount /mnt on /nix when separate"
        run: |
          echo "machine: $(nproc) vCPU, $(free -g | awk '/^Mem:/{print $2}') GiB RAM"
          {
            echo "### Kernel cache run"
            echo "| board | runner | machine | duration |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache /usr/local/lib/node_modules
          sudo apt-get clean
          docker image prune -af >/dev/null 2>&1 || true
          if [ -d /mnt ] && [ "$(df --output=target /mnt | tail -1)" = "/mnt" ]; then
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
            echo "/nix is now on /mnt"
          else
            echo "/mnt absent: keeping the store on /"
          fi
          echo "free after cleanup:"
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: cachix/cachix-action@v17
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: havenos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
          # Explicit push below: `push: true` would also upload the compiler
          # and source tarballs used to build the kernel, which no user needs.
          skipPush: true

      - name: "Build ${{ matrix.board }} on ${{ matrix.runner }}"
        id: build
        run: |
          start=$(date +%s)
          # Three outputs, three store paths: `out` (Image, DTBs, System.map),
          # `modules` (133 MiB, the bulk of the build) and `dev` (the build
          # tree: headers, scripts, Module.symvers). Pushing only `out` leaves
          # consumers to rebuild the kernel locally — measured 404 on every
          # `-modules` narinfo, and again today on `-dev`: any out-of-tree
          # module (uwe5622) depends on `kernel.dev` and would otherwise force
          # a full 43-minute kernel rebuild just to get the headers.
          nix build --no-link ".#kernel-${{ matrix.board }}" ".#kernel-${{ matrix.board }}.modules" ".#kernel-${{ matrix.board }}.dev"
          path="$(nix eval --raw ".#kernel-${{ matrix.board }}")"
          modules="$(nix eval --raw ".#kernel-${{ matrix.board }}.modules")"
          dev="$(nix eval --raw ".#kernel-${{ matrix.board }}.dev")"
          dur=$(( $(date +%s) - start ))
          printf 'path=%s\nmodules=%s\ndev=%s\n' "$path" "$modules" "$dev" >> "$GITHUB_OUTPUT"
          echo "Built: $path + $modules + $dev in ${dur}s"
          echo "| ${{ matrix.board }} | ${{ matrix.runner }} | $(nproc) vCPU | ${dur}s |" >> "$GITHUB_STEP_SUMMARY"
          nix path-info -Sh "$path" "$modules"

      - name: "Push the closure of ${{ matrix.board }}"
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        run: |
          path="${{ steps.build.outputs.path }}"
          if [ -z "${CACHIX_SIGNING_KEY}" ]; then
            echo "::warning title=No CACHIX_SIGNING_KEY::Built, not pushed: this cache refuses an unsigned narinfo. Add the CACHIX_SIGNING_KEY secret."
            exit 0
          fi
          for p in "${{ steps.build.outputs.path }}" "${{ steps.build.outputs.modules }}" "${{ steps.build.outputs.dev }}"; do
            cachix push havenos "$p"
            hash="${p#/nix/store/}"; hash="${hash%%-*}"
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://havenos.cachix.org/$hash.narinfo")"
            echo "narinfo $hash -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error title=Push refusé::narinfo HTTP $code — le cache exige une signature côté client (CACHIX_SIGNING_KEY manquant ?)."
              exit 1
            fi
          done

      - name: "Report the missing cache token"
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        run: |
          echo "::warning title=No CACHIX_AUTH_TOKEN::${{ matrix.board }} was built but not pushed. Add the CACHIX_AUTH_TOKEN secret to this repository to fill the cache."
