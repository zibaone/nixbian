name: Kernel cache

# Builds one reference kernel per major ARM family and pushes its closure to
# the Cachix cache. This is the only cache content a user benefits from:
# `Nix CI` evaluates configurations, it never compiles a kernel, so before
# this workflow the cache held a metadata copy and a devShell only.
#
# Cross, not native. `nix/parts/packages.nix` already picks
# `pkgsCross.aarch64-multiplatform` (or armv7l / riscv64 / loongarch64) when
# the board arch differs from the host, so an x86_64 runner builds the ARM
# kernels. A native ARM runner would be slower, not faster.
#
# One board per major family, matching the boards the flake checks evaluate:
# sunxi64 (H616), sunxi 32-bit, bcm2711 (Raspberry Pi 4), meson64 (Amlogic),
# rockchip64 (RK3588).
on:
  schedule:
    # Sunday 03:00 UTC: Sunday morning, after the Monday metadata refresh has
    # had a week to land, and far from the working day.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      boards:
        description: "Space-separated board keys (empty = the five reference boards)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-cache
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.matrix.outputs.boards }}
    steps:
      - name: Build the matrix
        id: matrix
        run: |
          boards="${{ github.event.inputs.boards }}"
          if [ -z "$boards" ]; then
            boards="orangepizero3-edge orangepizero-current rpi4b-current aml-a311d-cc-current orangepi5-current"
          fi
          # One JSON array, consumed by `strategy.matrix` below.
          json="$(printf '%s\n' $boards | jq -R . | jq -sc .)"
          echo "boards=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $json"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.plan.outputs.boards) }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Measured: the H616 cross build dies at the final link with "No space
      # left on device" after ~95 min. `/` has ~14 GiB free; `/mnt` is a
      # separate ~74 GiB volume. Bind it onto /nix before Nix creates its store.
      - name: "Disk: mount /mnt on /nix when separate"
        run: |
          df -h / /mnt || true
          if [ -d /mnt ] && [ "$(df --output=target /mnt | tail -1)" = "/mnt" ]; then
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
            echo "/nix is now on /mnt"
          else
            echo "/mnt absent or on root: keeping the default store"
          fi
          df -h / /nix || true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: cachix/cachix-action@v17
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: havenos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
          # Explicit push below: `push: true` would also upload the compiler
          # and source tarballs used to build the kernel, which no user needs.
          skipPush: true

      - name: "Build ${{ matrix.board }}"
        id: build
        run: |
          path="$(nix build --no-link --print-out-paths ".#kernel-${{ matrix.board }}")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Built: $path"
          nix path-info -Sh "$path"

      - name: "Push the closure of ${{ matrix.board }}"
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        run: |
          path="${{ steps.build.outputs.path }}"
          if [ -z "${CACHIX_SIGNING_KEY}" ]; then
            echo "::warning title=No CACHIX_SIGNING_KEY::Built, not pushed: this cache refuses an unsigned narinfo. Add the CACHIX_SIGNING_KEY secret."
            exit 0
          fi
          cachix push havenos "$path"
          hash="${path#/nix/store/}"; hash="${hash%%-*}"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://havenos.cachix.org/$hash.narinfo")"
          echo "narinfo $hash -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error title=Push refusé::narinfo HTTP $code — le cache exige une signature côté client (CACHIX_SIGNING_KEY manquant ?)."
            exit 1
          fi

      - name: "Report the missing cache token"
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        run: |
          echo "::warning title=No CACHIX_AUTH_TOKEN::${{ matrix.board }} was built but not pushed. Add the CACHIX_AUTH_TOKEN secret to this repository to fill the cache."
