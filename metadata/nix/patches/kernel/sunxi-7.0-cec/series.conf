# Correctif CEC HDMI (P3.0 du lot noyau).
# Appliqué APRÈS le jeu Armbian : les patchs megous 0004/0005 touchent déjà
# dw_hdmi_detect() et dw_hdmi_irq() dans dw-hdmi.c, et 0005 passe les
# messages EVENT=/read_hpd en dev_info (c'est ce qui rend la mesure possible).
#
# 0001 est validé sur la carte par rechargement à chaud de dw-hdmi-cec.ko
# (le module est =m).  0002 vit dans dw-hdmi.c, compilé en dur (=y) : il ne
# peut pas être chargé à chaud et sera validé sur la SD de secours avec le lot.
0001-drm-bridge-dw-hdmi-cec-abort-in-flight-tx-before-gating-the-clock.patch
0002-drm-bridge-dw-hdmi-reprobe-the-connector-when-the-edid-read-fails.patch
